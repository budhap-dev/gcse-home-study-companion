name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/check-version-bump.mjs origin/${{ github.base_ref }}

  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  database:
    name: Migrations and policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start Postgres and apply migrations and seed
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Lint migrations
        run: supabase db lint --level error
      - name: Run policy and status tests
        run: supabase test db
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import the sample content pack
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node supabase/scripts/import-content.ts | tee import.log
          grep -Eq "Imported ([0-9]+) topic\(s\): \1 new version\(s\), 0 unchanged" import.log
          node supabase/scripts/import-content.ts | tee import-again.log
          grep -Eq "Imported ([0-9]+) topic\(s\): 0 new version\(s\), \1 unchanged" import-again.log
      - name: Stop
        if: always()
        run: supabase stop --no-backup
