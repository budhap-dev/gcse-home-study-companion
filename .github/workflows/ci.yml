name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/check-version-bump.mjs origin/${{ github.base_ref }}

  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  browser:
    # The built app in a real browser at phone and desktop width: diagrams or pages that
    # scroll sideways, lines drawn through diagram labels, script errors, and lesson checks
    # not marked Correct when given their own answer. Every PR walks a fixed sample that
    # reaches every subject, plus every topic whose content the PR changes; the whole pack
    # is walked weekly by browser-full.yml.
    name: Browser checks
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Serve the build
        working-directory: apps/web
        run: |
          npx vite preview --outDir dist --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - name: Topics this PR changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            ids=$(git diff --name-only "$base"...HEAD -- 'supabase/seed/content/*/*.json' | while read -r f; do [ -f "$f" ] && basename "$f" .json; done | paste -sd, -)
          fi
          echo "topics=${ids:-}" >> "$GITHUB_OUTPUT"
          echo "Changed topics: ${ids:-none}"
      - name: Walk
        env:
          SAMPLE: '1'
          TOPICS: ${{ steps.changed.outputs.topics }}
        run: node e2e/walk.mjs --base http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: e2e-report.json
          retention-days: 14

  database:
    name: Migrations and policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start Postgres and apply migrations and seed
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Lint migrations
        run: supabase db lint --level error
      - name: Run policy and status tests
        run: supabase test db
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import the sample content pack
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node supabase/scripts/import-content.ts | tee import.log
          grep -Eq "Imported ([0-9]+) topic\(s\): \1 new version\(s\), 0 unchanged" import.log
          node supabase/scripts/import-content.ts | tee import-again.log
          grep -Eq "Imported ([0-9]+) topic\(s\): 0 new version\(s\), \1 unchanged" import-again.log
      - name: Stop
        if: always()
        run: supabase stop --no-backup
